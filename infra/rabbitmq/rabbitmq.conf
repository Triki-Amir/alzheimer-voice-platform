# TLS-only: plaintext AMQP is disabled, clients must connect on 5671.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
ssl_options.certfile   = /etc/rabbitmq/certs/rabbitmq.crt
ssl_options.keyfile    = /etc/rabbitmq/certs/rabbitmq.key
# No client certs (mTLS) required — clients authenticate with user/password
# over the encrypted channel, not with a certificate.
ssl_options.verify     = verify_none
ssl_options.fail_if_no_peer_cert = false

# Management UI stays on plain HTTP inside the container network.
management.tcp.port = 15672
