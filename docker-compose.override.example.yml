# docker-compose.override.yml
# Ce fichier est automatiquement fusionné avec docker-compose.yml
# Il est ignoré par Git (ajoutez-le dans .gitignore)

services:
  rabbitmq:
    environment:
      - RABBITMQ_USE_TLS=false
    ports:
      - "127.0.0.1:5672:5672"   # Port sans TLS
      - "127.0.0.1:15672:15672" # Management UI

  ingestion-service:
    environment:
      - RABBITMQ_PORT=5672
      - RABBITMQ_USE_TLS=false
    extra_hosts:
      - "rabbitmq:192.168.100.42"  # Votre IP (optionnel)

  auth-service:
    environment:
      - RABBITMQ_PORT=5672
      - RABBITMQ_USE_TLS=false