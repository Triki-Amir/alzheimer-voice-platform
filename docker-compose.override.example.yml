# Local development convenience ONLY.
#
# docker compose automatically merges docker-compose.override.yml on top of
# docker-compose.yml. Copy this file to docker-compose.override.yml on each
# developer machine when you need direct access to containers from the host.
#
# Safe for both cases:
# - SSH machine: ports bind to 127.0.0.1, so the services are reachable only
#   from the host itself and not from the network.
# - Local laptops: same localhost binds work for pgAdmin, curl, and scripts.
#
# Usage:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   docker compose up -d

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only, not 0.0.0.0

  rabbitmq:
    ports:
      - "127.0.0.1:15672:15672" # management UI
      # AMQP itself (5672) is rarely needed directly in dev; add if you need it:
      # - "127.0.0.1:5671:5671"

  minio:
    ports:
      - "127.0.0.1:9001:9001"   # console
      # - "127.0.0.1:9000:9000" # S3 API, add if a local script needs it

  auth-service:
    ports:
      - "127.0.0.1:8001:8000"   # bypass nginx for quick curl/Postman testing

  ingestion-service:
    ports:
      - "127.0.0.1:8002:8000"

  preprocessing-service:
    environment:
      - PYTHONPATH=/shared
    volumes:
      - ./shared:/shared:ro
