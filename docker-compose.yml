services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    build: ./infra/rabbitmq
    env_file: .env
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    volumes:
      - ./infra/minio/init-buckets.sh:/scripts/init-buckets.sh

  nginx:
    build: ./infra/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
      - ingestion-service
    volumes:
      - ./infra/nginx/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./infra/nginx/certs/server.key:/etc/nginx/certs/server.key:ro

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8002:8000"

  quality-check-service:
    build:
      context: .
      dockerfile: services/quality-check-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  preprocessing-service:
    build:
      context: .
      dockerfile: services/preprocessing-service/Dockerfile
    env_file: .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - diarization_models:/root/.cache/huggingface

  stt-service:
    build:
      context: .
      dockerfile: services/stt-service/Dockerfile
    env_file: .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: celery -A app.worker worker -l info -Q stt_transcription --pool=solo -E
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - stt_models:/root/.cache/huggingface

  # --- ACOUSTIC FEATURE EXTRACTION SERVICE ---
  acoustic-feature-service:
    build:
      context: .
      dockerfile: services/acoustic-feature-service/Dockerfile
    container_name: voiceapp_acoustic_feature
    env_file: .env
    command: celery -A worker.app worker -l info -Q acoustic_extraction --pool=solo -E
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  linguistic-feature-service:
    build:
      context: .
      dockerfile: services/linguistic-feature-service/Dockerfile
    container_name: voiceapp_linguistic_feature
    env_file: .env
    environment:
      - POS_MODEL_PATH=/models/xlmr-tunisian-pos-final
    command: celery -A app.worker.app worker -l info -Q linguistic_extraction --pool=solo -E
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - /home/amir/stage/alzheimer-voice-platform/annotattion_tunisian_training/xlmr-tunisian-pos-final:/models/xlmr-tunisian-pos-final:ro

  feature-engineering-service:
    build:
      context: .
      dockerfile: services/feature-engineering-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  fusion-classification-service:
    build:
      context: .
      dockerfile: services/fusion-classification-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
# --- LOCAL LLM INFERENCE ENGINE ---
  vllm-server:
    image: vllm/vllm-openai:v0.6.3.post1
    container_name: voiceapp_vllm
    runtime: nvidia
    env_file: .env
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=0
    command: >
      --model Qwen/Qwen2.5-32B-Instruct-AWQ
      --quantization awq_marlin
      --gpu-memory-utilization 0.70
      --max-model-len 4096
      --enforce-eager
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30        # Total threshold = 300s (5 minutes)
      start_period: 90s  # Gives vLLM 90s before the first health probe starts counting retries
    ports:
      - "8000:8000"
    volumes:
      - llm_models:/root/.cache/huggingface
volumes:
  pg_data:
  minio_data:
  diarization_models:
  stt_models:
  llm_models:
