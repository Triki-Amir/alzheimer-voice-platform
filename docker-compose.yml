services:
  postgres:
    build: ./infra/postgres
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/certs/server.crt", "-c", "ssl_key_file=/var/lib/postgresql/certs/server.key"]
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    build:
      context: .
      dockerfile: infra/rabbitmq/Dockerfile
    env_file: .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    platform: linux/amd64
    container_name: alzheimer-voice-platform-minio-1
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
     - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
     - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
     - minio_data:/data
     - ./infra/minio/certs/minio.crt:/root/.minio/certs/public.crt:ro
     - ./infra/minio/certs/minio.key:/root/.minio/certs/private.key:ro
    ports:
     - "9001:9001"
    healthcheck:
     test: ["CMD", "curl", "-fk", "https://localhost:9000/minio/health/live"]
     interval: 10s
     timeout: 5s
     retries: 5
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    volumes:
      - ./infra/minio/init-buckets.sh:/scripts/init-buckets.sh

  nginx:
    build: ./infra/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
      - ingestion-service
    volumes:
      - ./infra/nginx/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./infra/nginx/certs/server.key:/etc/nginx/certs/server.key:ro

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"


  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8001:8000"


  quality-check-service:
    build:
      context: .
      dockerfile: services/quality-check-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  preprocessing-service:
    build:
      context: .
      dockerfile: services/preprocessing-service/Dockerfile
    env_file: .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - diarization_models:/root/.cache/huggingface

  stt-service:
    build:
      context: .
      dockerfile: services/stt-service/Dockerfile
    env_file: .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: celery -A app.worker worker -l info -Q stt_transcription --pool=solo -E
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - stt_models:/root/.cache/huggingface

  # --- ACOUSTIC FEATURE EXTRACTION SERVICE ---
  acoustic-feature-service:
    build:
      context: .
      dockerfile: services/acoustic-feature-service/Dockerfile
    container_name: voiceapp_acoustic_feature
    env_file: .env
    command: celery -A worker.app worker -l info -Q acoustic_extraction --pool=solo -E
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  linguistic-feature-service:
    build:
      context: .
      dockerfile: services/linguistic-feature-service/Dockerfile
    container_name: voiceapp_linguistic_feature
    env_file: .env
    environment:
      - POS_MODEL_PATH=/models/xlmr-tunisian-pos-finnal
    command: celery -A app.worker.app worker -l info -Q linguistic_extraction --pool=solo -E
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - /home/amir/stage/alzheimer-voice-platform/annotattion_tunisian_training/xlmr-tunisian-pos-final:/models/xlmr-tunisian-pos-final:ro

  feature-engineering-service:
    build:
      context: .
      dockerfile: services/feature-engineering-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  fusion-classification-service:
    build:
      context: .
      dockerfile: services/fusion-classification-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
# --- LOCAL LLM INFERENCE ENGINE ---
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: voiceapp_vllm
    runtime: nvidia
    env_file: .env
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=0
    command: >
      --model Qwen/Qwen2.5-32B-Instruct-AWQ
      --quantization awq
      --gpu-memory-utilization 0.55
      --max-model-len 4096
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - llm_models:/root/.cache/huggingface

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: voiceapp_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost
      - NEXT_PUBLIC_WS_URL=wss://localhost
      - WATCHPACK_POLLING=true
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
    depends_on:
      - nginx

volumes:
  pg_data:
  minio_data:
  diarization_models:
  stt_models:
  llm_models: