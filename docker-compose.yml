services:
  postgres:
    build: ./infra/postgres
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/certs/server.crt", "-c", "ssl_key_file=/var/lib/postgresql/certs/server.key"]
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    build:
      context: .
      dockerfile: infra/rabbitmq/Dockerfile
    env_file: .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

    healthcheck:
      # -k: healthcheck runs against "localhost", not the "minio" CN the
      # cert was issued for, so hostname verification is skipped here —
      # this is an internal liveness probe, not the security boundary.
      test: ["CMD", "curl", "-kf", "https://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    volumes:
      - ./infra/minio/init-buckets.sh:/scripts/init-buckets.sh

  nginx:
    build: ./infra/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
      - ingestion-service
    volumes:
      - ./infra/nginx/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./infra/nginx/certs/server.key:/etc/nginx/certs/server.key:ro

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  ingestion-service:
   build:
     context: .
     dockerfile: services/ingestion-service/Dockerfile
   env_file: .env
   depends_on:
     postgres:
       condition: service_healthy
     rabbitmq:
       condition: service_healthy
     minio:
       condition: service_healthy
        
  preprocessing-service:
    build:
      context: .
      dockerfile: services/preprocessing-service/Dockerfile
    env_file: .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - diarization_models:/root/.cache/huggingface

  stt-service:
    build:
      context: .
      dockerfile: services/stt-service/Dockerfile
    env_file: .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: celery -A app.worker worker -l info -Q stt_transcription --pool=solo -E
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - stt_models:/root/.cache/huggingface

  # --- ACOUSTIC FEATURE EXTRACTION SERVICE ---
  acoustic-feature-service:
    build:
      context: .
      dockerfile: services/acoustic-feature-service/Dockerfile
    container_name: voiceapp_acoustic_feature
    env_file: .env
    environment:
      - RABBITMQ_PORT=5672
    command: celery -A app.worker worker -l info -Q acoustic_extraction --pool=solo -E    
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  linguistic-feature-service:
    build:
      context: .
      dockerfile: services/linguistic-feature-service/Dockerfile
    container_name: voiceapp_linguistic_feature
    env_file: .env
    environment:
      - POS_MODEL_PATH=/models/xlmr-tunisian-pos-final
    command: celery -A app.worker.app worker -l info -Q linguistic_extraction --pool=solo -E
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - /home/amir/stage/alzheimer-voice-platform/annotattion_tunisian_training/xlmr-tunisian-pos-final:/models/xlmr-tunisian-pos-final:ro

  feature-engineering-service:
    build:
      context: .
      dockerfile: services/feature-engineering-service/Dockerfile
    container_name: voiceapp_feature_engineering
    env_file: .env
    command: celery -A app.worker worker -l info -Q feature_engineering --pool=solo -E
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
  
  fusion-classification-service:
    build:
      context: .
      dockerfile: services/fusion-classification-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: voiceapp_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://192.168.114.196:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://192.168.114.196:8000}
      - WATCHPACK_POLLING=true
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
    depends_on:
      - nginx

volumes:
  pg_data:
  minio_data:
  diarization_models:
  stt_models:
  llm_models: